name: MicroFrontend Build & Deploy

on:
  push:
    tags:
      - "*"

  pull_request:
    branches:
      - master
    types:
      - synchronize
      - opened
      - reopened

jobs:
  deploy:
    runs-on:
      group: default

    environment: ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GIT_APP_ID }}
          private-key: ${{ secrets.GIT_APP_PRIVATE_KEY }}
          owner: SallaApp

      - uses: SallaApp/.CI/mf-deployer@master
        with:
          env: ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
          github_token: ${{ steps.app-token.outputs.token }}
          imap_deployer_secret: ${{ secrets.IMAP_DEPLOYER_SECRET }}
          npm_token: ${{ secrets.NPM_PUBLISH_TOKEN }}
          publish_to_npm: "true"
          asset_url: ${{ vars.ASSETS_PROD_HOST }}
          assets_prod_s3_bucket: ${{ secrets.ASSETS_PROD_S3_BUCKET }}
          assets_prod_s3_endpoint: ${{ secrets.ASSETS_PROD_S3_ENDPOINT }}
          assets_prod_s3_key_id: ${{ secrets.ASSETS_PROD_S3_KEY_ID }}
          assets_prod_s3_region: ${{ secrets.ASSETS_PROD_S3_REGION }}
          assets_prod_s3_secret_key: ${{ secrets.ASSETS_PROD_S3_SECRET_KEY }}
          gh_vars: ${{ toJSON(vars) }}
          gh_secrets: ${{ toJSON(secrets) }}
